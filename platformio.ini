[env:xiao]
platform = espressif32@6.9.0   ; Arduino core 2.0.17; newer platforms (core 3.x) break LovyanGFX 1.1.16 / NimBLE 1.4.2
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_port = COM9    ; this PC has Bluetooth COM ports that auto-detect picks by mistake
monitor_port = COM9
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=247
lib_deps =
  lovyan03/LovyanGFX@1.1.16
  bitbank2/AnimatedGIF@2.1.1
  h2zero/NimBLE-Arduino@1.4.2
  bblanchon/ArduinoJson@7.2.1
