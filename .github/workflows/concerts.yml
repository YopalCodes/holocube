name: Concert dates
on:
  schedule:
    - cron: "17 9 * * *"     # daily, ~5 AM Eastern
  workflow_dispatch:          # "Run workflow" button in the Actions tab
permissions:
  contents: write
concurrency: concerts
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch upcoming shows
        run: python tools/fetch_concerts.py
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CONCERT_COUNTRIES: United States   # comma-separated; empty = shows everywhere
          APIFY_TASK: aZ7ELuEAtuO2dCLVf   # saved Bandsintown task in Apify; delete this line to use the actor directly
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/concerts
          git diff --cached --quiet || { git commit -m "Update concert dates" && git push; }
